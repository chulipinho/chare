{{define "content"}}
<section class="error-page">
<h1>{{.Status}} {{.Title}}</h1>
<p>{{.Message}}</p>
{{if .Failures}}
<ul class="failures">
{{range .Failures}}<li><strong>{{.Name}}</strong>: {{.Reason}}</li>{{end}}
</ul>
{{end}}
<p><a href="{{browseHref .Back}}">Back to browse</a></p>
</section>
{{end}}
