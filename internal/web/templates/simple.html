{{define "simple"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
body {
  margin: 0 auto;
  padding: 1em;
  max-width: 40em;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;
  line-height: 1.5;
  color: #111;
  background: #fff;
}
a { color: #0645ad; }
h1, h2, h3, h4, h5, h6 { line-height: 1.2; }
img { max-width: 100%; height: auto; }
pre { white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word; padding: 0.75em; background: #f4f4f4; }
code { font-family: Menlo, Consolas, monospace; font-size: 0.9em; }
blockquote { margin-left: 1em; padding-left: 1em; border-left: 3px solid #ccc; }
table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
th, td { border: 1px solid #ccc; padding: 0.35em; text-align: left; }
.back { margin: 0 0 1em; }
</style>
</head>
<body>
<p class="back"><a href="{{browseHref .Parent}}">&larr; Back</a></p>
<h1>{{.Title}}</h1>
{{.HTML}}
</body>
</html>
{{end}}
